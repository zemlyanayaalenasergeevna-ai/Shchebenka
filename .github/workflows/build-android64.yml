name: Build Shchebenka - Android64

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Shchebenka
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          build-config: Release

      - name: Locate .geode
        shell: bash
        run: |
          set -e
          FILE=$(find build out -type f -name '*.geode' 2>/dev/null | head -n 1 || true)
          if [ -z "$FILE" ]; then
            echo "No .geode file found."
            find . -type f | sort | tail -n 200
            exit 1
          fi
          mkdir -p artifacts
          cp "$FILE" artifacts/alena.shchebenka.geode

      - name: Upload installable .geode
        uses: actions/upload-artifact@v4
        with:
          name: alena.shchebenka-android64
          path: artifacts/alena.shchebenka.geode
          if-no-files-found: error
